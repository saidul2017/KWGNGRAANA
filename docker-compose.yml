# Deploy KWGN Learning Hub di server tunggal (VPS, Raspberry Pi, NUC, dll.)
#
# Cara pakai:
#   1. cp .env.example .env  → isi SESSION_PASSWORD, GEMINI_API_KEY, dll.
#   2. docker compose up -d --build
#   3. Pertama kali: docker compose exec app sh -c "node node_modules/tsx/dist/cli.mjs scripts/seed.ts"
#      (atau set SEED_ON_START=1 sekali)
#   4. Buka http://localhost:3000  (atau pasang reverse proxy/HTTPS — lihat README)
#
# Update aplikasi:
#   git pull && docker compose up -d --build
#
# Backup DB:
#   docker compose exec app sh -c "cp /app/data/kwgn.db /app/data/backup-$(date +%F).db"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kwgn-learning-hub:latest
    container_name: kwgn-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/kwgn.db
      # Wajib di-set di .env (entrypoint akan tolak kalau kosong/<32 char)
      SESSION_PASSWORD: ${SESSION_PASSWORD}
      DEFAULT_LECTURER_EMAIL: ${DEFAULT_LECTURER_EMAIL:-dosen@kwgn.id}
      DEFAULT_LECTURER_NAME: ${DEFAULT_LECTURER_NAME:-Dosen Kewarganegaraan}
      DEFAULT_LECTURER_PASSWORD: ${DEFAULT_LECTURER_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Set SEED_ON_START=1 sekali, lalu kembalikan ke 0 setelah seed jalan.
      SEED_ON_START: ${SEED_ON_START:-0}
    volumes:
      # Volume terpisah untuk DB → data persisten antar update image
      - kwgn-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kwgn-data:
    name: kwgn-data
