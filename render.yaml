# Konfigurasi deploy ke Render (https://render.com)
#
# 1. Sign-up Render (login dengan GitHub)
# 2. Dashboard → New → Blueprint → connect repo KWGNGRAANA
#    Render akan baca file ini secara otomatis.
# 3. Saat prompt environment variables, isi:
#      SESSION_PASSWORD          (≥32 karakter random)
#      DEFAULT_LECTURER_PASSWORD (password baru kuat)
#      GEMINI_API_KEY            (rotasi dari aistudio.google.com)
# 4. Klik Apply → Render build & deploy otomatis.
# 5. Setelah live, di Shell tab jalankan sekali:
#      node node_modules/tsx/dist/cli.mjs scripts/seed.ts
#    untuk seed dosen + 43 mahasiswa + soal demo.
#
# Auto-deploy aktif saat git push ke main.

services:
  - type: web
    name: kwgn-learning-hub
    runtime: docker
    plan: starter   # $7/bln dengan persistent disk; gratis tier tidak punya disk
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /app/data/kwgn.db
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SESSION_PASSWORD
        sync: false   # user akan diminta isi saat blueprint apply
      - key: DEFAULT_LECTURER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: kwgn-data
      mountPath: /app/data
      sizeGB: 1
