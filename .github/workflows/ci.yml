name: CI

on:
  push:
    branches: [main, master, "**"]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Syntax check (py_compile)
        run: |
          python -m py_compile streamlit_app.py
          find lib -name "*.py" -print0 | xargs -0 python -m py_compile
      - name: Lint (ruff)
        run: ruff check .
      - name: Smoke import
        run: |
          # Pastikan modul lib bisa di-import tanpa error
          python -c "from lib import db, schema, auth, scoring, ai, kb, seed; print('OK')"
