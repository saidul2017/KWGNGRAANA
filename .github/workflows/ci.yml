name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check semua Python file
        run: |
          set -e
          find . -name "*.py" -not -path "./.venv/*" | while read f; do
            python -m py_compile "$f"
          done
          echo "✓ All Python files compile cleanly"

      - name: Smoke test init_db
        run: |
          python scripts/init_db.py
          echo "✓ DB schema OK"

      - name: Verify streamlit_app imports
        env:
          DEFAULT_LECTURER_PASSWORD: ci_dummy
        run: |
          python -c "import streamlit_app; print('✓ streamlit_app imports OK')"
